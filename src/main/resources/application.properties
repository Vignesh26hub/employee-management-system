# ==============================================================================
# Employee Management System - Application Configuration
# ==============================================================================

# Application Metadata
spring.application.name=employee-management-system

# Server Port:
# Uses Render's dynamic PORT environment variable in production,
# falling back to port 8080 when running locally.
server.port=${PORT:8080}

# ==============================================================================
# Aiven Cloud MySQL Database Connection Settings
# ==============================================================================
# Database connection is fully driven by environment variables:
#   - DB_HOST (Aiven MySQL host)
#   - DB_PORT (Aiven MySQL port, e.g. 18701)
#   - DB_NAME (Database name, e.g. defaultdb)
#   - DB_USER (Username, e.g. avnadmin)
#   - DB_PASSWORD (Password - MUST be provided via environment variable)
#
# SSL is REQUIRED for Aiven Cloud MySQL (sslMode=REQUIRED).
# Sensitive credentials are NEVER hardcoded into source code or Git.
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:mysql-3fbad230-vigneshvig2612-783b.g.aivencloud.com}:${DB_PORT:18701}/${DB_NAME:defaultdb}?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:${DB_USERNAME:avnadmin}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# HikariCP Connection Pool Configuration (Cloud Database Resilience)
# ==============================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ==============================================================================
# Hibernate / JPA Settings
# ==============================================================================
# 'update': Automatically creates tables if they don't exist, but NEVER drops
# or deletes existing tables, preserving all employee data intact.
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries in console for debugging and monitoring
spring.jpa.show-sql=true

# Format SQL output so it is readable and nicely indented
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect for Hibernate 6
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-in-View: Disabled for clean separation of concerns and preventing lazy loading leaks
spring.jpa.open-in-view=false
