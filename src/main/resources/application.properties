# ==============================================================================
# Employee Management System - Application Configuration
# ==============================================================================

# Application Metadata
spring.application.name=employee-management-system
server.port=8080

# ==============================================================================
# MySQL Database Connection Settings
# ==============================================================================
# Database credentials can be overridden using environment variables:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# This ensures sensitive credentials are NEVER committed to version control.
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# Hibernate / JPA Settings
# ==============================================================================
# 'update': Hibernate will automatically create or update the table schema to match entity definitions.
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries in console for debugging and learning
spring.jpa.show-sql=true

# Format SQL output so it is readable and nicely indented
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect for Hibernate 6
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-in-View: Disabled for clean separation of concerns and preventing lazy loading leaks
spring.jpa.open-in-view=false
